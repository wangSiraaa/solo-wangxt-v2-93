[project]
name = "irv-backend"
version = "0.1.0"
description = "Instant-runoff voting tally API for synthetic club elections"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.1,<4.0",
    "django-cors-headers>=4.3,<5.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.8,<5.0",
    "pytest>=8.0,<9.0",
]
